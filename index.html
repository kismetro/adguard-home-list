<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>접속이 차단되었습니다</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #050816;
      --card: #0f172a;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.12);
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --danger: #f97373;
      --shadow: 0 18px 45px rgba(15,23,42,0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 55%, #000 100%);
      color: var(--text-main);
    }
    .card {
      width: min(480px, 92vw);
      background: radial-gradient(circle at top left, rgba(56,189,248,0.12), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(248,113,113,0.16), transparent 55%),
                  var(--card);
      border-radius: 20px;
      padding: 28px 26px 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(148,163,184,0.18);
      position: relative;
      overflow: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.35);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 12px rgba(248,113,113,0.9);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span.icon {
      font-size: 24px;
      line-height: 1;
    }
    .subtitle {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .reason-box {
      margin: 0 0 18px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(55,65,81,0.7);
      font-size: 13px;
      color: var(--text-sub);
    }
    .reason-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .reason {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .reason-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.4);
      white-space: nowrap;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
    }
    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #020617;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      box-shadow: 0 12px 30px rgba(56,189,248,0.35);
    }
    .btn-main span.icon {
      font-size: 16px;
    }
    .note {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.6;
    }
    .note strong {
      color: #e5e7eb;
      font-weight: 600;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.45);
      background: rgba(15,23,42,0.9);
      color: #9ca3af;
    }
    @media (max-width: 480px) {
      .card { padding: 22px 18px 18px; }
      h1 { font-size: 20px; }
      .subtitle { font-size: 13px; }
      .note { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      FAMILY DNS FILTER
    </div>

    <h1>
      <span class="icon">🛑</span>
      이 사이트는 잠깐 멈출게요
    </h1>

    <p class="subtitle">
      여기는 <strong>아빠가 선 넘었다고 표시해 둔 구역</strong>이에요.  
      다른 건강한 사이트로 돌아가 볼까요?
    </p>

    <section class="reason-box">
      <div class="reason-title">BLOCK REASON</div>
      <div class="reason">
        <span>무료 불법 만화 / 성인·도박류 사이트로 분류됨</span>
        <span class="reason-badge">집 안 공용 네트워크 정책</span>
      </div>
    </section>

    <section class="actions">
      <button class="btn-main" type="button">
        <span class="icon">📞</span>
        이 사이트 꼭 봐야 한다면 &nbsp;→&nbsp; 아빠에게 직접 요청하기
      </button>
      <p class="note">
        정말 공부·과제 때문에 필요한 사이트라면  
        <strong>무엇을, 왜 봐야 하는지 설명</strong>하고 아빠에게 연락해 주세요.<br>
        “그냥 심심해서”는 자동 거절됩니다 🙂
      </p>
    </section>

    <footer class="footer">
      <span class="chip">관리자: 아빠 DNS 관제센터</span>
      <span>로그는 남습니다. &nbsp;차분하게 이야기해요.</span>
    </footer>
  </main>
</body>
</html>
